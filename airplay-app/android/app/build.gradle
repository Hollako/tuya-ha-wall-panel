plugins {
  id 'com.android.application'
}

android {
  namespace 'com.wallpanel.audioreceiver'
  compileSdk 34
  sourceSets.main.java.srcDir '../../../shared/audio-receiver/src'

  defaultConfig {
    applicationId 'com.wallpanel.audioreceiver'
    minSdk 27
    targetSdk 27
    versionCode 15
    versionName '1.2.0'

    ndk {
      abiFilters 'arm64-v8a', 'armeabi-v7a'
    }
  }

  signingConfigs {
    release {
      def propsFile = rootProject.file('signing/keystore.properties')
      if (propsFile.exists()) {
        def props = new Properties()
        props.load(new FileInputStream(propsFile))
        storeFile file(props['storeFile'] ?: 'signing/wpar-release.keystore')
        storePassword props['storePassword']
        keyAlias props['keyAlias']
        keyPassword props['keyPassword']
      }
    }
  }

  buildTypes {
    release {
      minifyEnabled false
      shrinkResources false
      if (signingConfigs.release.storeFile != null) {
        signingConfig signingConfigs.release
      }
    }
    debug {
      // Debug uses the debug signing config automatically.
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }

  packagingOptions {
    jniLibs {
      useLegacyPackaging true
    }
  }

  lint {
    abortOnError false
    checkReleaseBuilds false
  }
}

dependencies {
  // No AndroidX dependencies; only framework APIs.
}
